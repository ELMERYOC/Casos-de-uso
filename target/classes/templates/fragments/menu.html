<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Menú Lateral</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<!-- Menú para ADMINISTRADOR -->
<nav th:fragment="menu-admin" class="navbar navbar-dark bg-dark flex-column vh-100 p-3" style="width: 250px;">
    <a class="navbar-brand mb-4" href="/admin/dashboard">🏥 Panel Admin</a>
    <ul class="nav flex-column w-100">
        <li class="nav-item mb-2">
            <a class="nav-link text-white" href="/admin/usuarios">
                👥 Gestión de Usuarios
            </a>
        </li>
        <li class="nav-item mb-2">
            <a class="nav-link text-white" href="/admin/sucursales">
                🏢 Sucursales
            </a>
        </li>
        <li class="nav-item mb-2">
            <a class="nav-link text-white" href="/admin/especialidades">
                Especialidades
            </a>
        </li>
        <li class="nav-item mb-2">
            <a class="nav-link text-white" href="/admin/citas">
                📅 Citas Agendadas
            </a>
        </li>
        <li class="nav-item mt-auto">
            <form th:action="@{/logout}" method="post" class="d-inline">
                <button type="submit" class="btn btn-outline-light w-100">
                    🚪 Cerrar Sesión
                </button>
            </form>
        </li>
    </ul>
</nav>

<!-- Menú para PACIENTE -->
<nav th:fragment="menu-paciente" class="navbar navbar-dark bg-primary flex-column vh-100 p-3" style="width: 250px;">
    <a class="navbar-brand mb-4" href="/paciente/dashboard"> Mi Portal</a>
    <ul class="nav flex-column w-100">
        <li class="nav-item mb-2">
            <a class="nav-link text-white" href="/citas/paso/1">
                Agendar Cita
            </a>
        </li>
        <li class="nav-item mb-2">
            <a class="nav-link text-white" href="/paciente/mis-citas">
                📋 Mis Citas
            </a>
        </li>
        <li class="nav-item mb-2">
            <a class="nav-link text-white" href="/paciente/perfil">
                Mi Perfil
            </a>
        </li>
        <li class="nav-item mt-auto">
            <form th:action="@{/logout}" method="post" class="d-inline">
                <button type="submit" class="btn btn-outline-light w-100">
                    Cerrar Sesión
                </button>
            </form>
        </li>
    </ul>
</nav>
</body>
</html>

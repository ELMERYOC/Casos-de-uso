<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Agendar Cita - Paso 5</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5" style="max-width: 600px;">
    <h3 class="mb-3 text-center">Agendar Cita Médica</h3>
    <div class="progress mb-4" style="height: 10px;">
        <div class="progress-bar bg-success" role="progressbar" style="width: 100%"></div>
    </div>
    <h5 class="text-center mb-4">Paso 5 de 5: Confirmar Cita</h5>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <form th:action="@{/citas/paso/5}" method="post" class="card p-4 shadow-sm">
        <div class="alert alert-info">
            <h5 class="alert-heading">Resumen de su Cita</h5>
            <hr>
            <p class="mb-1"><strong>Sucursal:</strong> <span th:text="${sucursalNombre}"></span></p>
            <p class="mb-1"><strong>Especialidad:</strong> <span th:text="${especialidadNombre}"></span></p>
            <p class="mb-1"><strong>Médico:</strong> <span th:text="${medicoNombre}"></span></p>
            <p class="mb-0"><strong>Fecha y Hora:</strong> <span th:text="${#temporals.format(fechaHora, 'dd/MM/yyyy HH:mm')}"></span></p>
        </div>

        <div class="mb-3">
            <label for="motivoConsulta" class="form-label fw-bold">Motivo de la consulta <span class="text-danger">*</span></label>
            <textarea class="form-control" id="motivoConsulta" name="motivoConsulta" rows="4" minlength="10" maxlength="2000" required placeholder="Describa brevemente el motivo de su visita (mínimo 10 caracteres)..."></textarea>
            <div class="form-text">Mínimo 10 caracteres, máximo 2000.</div>
        </div>

        <div class="d-flex justify-content-between">
            <a th:href="@{/citas/volver/4}" class="btn btn-secondary">Volver</a>
            <button type="submit" class="btn btn-success">Confirmar y Pagar</button>
        </div>
    </form>
</div>
</body>
</html>

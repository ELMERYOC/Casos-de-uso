<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Agendar Cita - Paso 1</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #f0f2f5 0%, #e9ecef 100%);
            min-height: 100vh;
        }
        .step-container {
            max-width: 700px;
            margin: 3rem auto;
        }
        .step-card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,.1);
            overflow: hidden;
        }
        .step-header {
            background: linear-gradient(135deg, #0d6efd 0%, #0a58ca 100%);
            color: white;
            padding: 2rem;
            text-align: center;
        }
        .progress {
            height: 12px;
            border-radius: 6px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #0d6efd 0%, #0a58ca 100%);
            border: none;
        }
        .btn-cancel {
            border: 2px solid #dc3545;
            color: #dc3545;
            font-weight: 600;
        }
        .btn-cancel:hover {
            background: #dc3545;
            color: white;
        }
    </style>
</head>
<body class="bg-light">
<div class="container step-container">
    <div class="card step-card">
        <div class="step-header">
            <h3 class="mb-2"><i class="fas fa-hospital me-2"></i>Agendar Cita Médica</h3>
            <p class="mb-0 opacity-75">Complete todos los pasos para agendar su cita</p>
        </div>

        <div class="p-4">
            <!-- Indicador de Progreso (CU-03) -->
            <div class="mb-4">
                <div class="d-flex justify-content-between mb-2">
                    <span class="fw-bold text-primary">Paso 1 de 5</span>
                    <span class="text-muted">Seleccione la Sucursal</span>
                </div>
                <div class="progress">
                    <div class="progress-bar bg-primary" role="progressbar" style="width: 20%" aria-valuenow="20" aria-valuemin="0" aria-valuemax="100"></div>
                </div>
            </div>

            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <i class="fas fa-exclamation-triangle me-2"></i>
                <span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <form th:action="@{/citas/paso/1}" method="post">
                <div class="mb-4">
                    <label for="sucursalId" class="form-label fw-bold">
                        <i class="fas fa-building me-2 text-primary"></i>Sede del Hospital
                    </label>
                    <select class="form-select form-select-lg" id="sucursalId" name="sucursalId" required>
                        <option value="">-- Seleccione una sede --</option>
                        <option th:each="sucursal : ${sucursales}" th:value="${sucursal.id}" th:text="${sucursal.nombre}"></option>
                    </select>
                    <div class="form-text">Seleccione la sucursal donde desea atenderse.</div>
                </div>

                <div class="d-flex justify-content-between gap-2">
                    <a href="/paciente/dashboard" class="btn btn-cancel btn-lg px-4">
                        <i class="fas fa-times me-2"></i>Cancelar
                    </a>
                    <button type="submit" class="btn btn-primary btn-lg px-4">
                        Siguiente <i class="fas fa-arrow-right ms-2"></i>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <div class="text-center mt-4">
        <a href="/" class="text-decoration-none text-muted">
            <i class="fas fa-home me-1"></i>Volver al Portal Principal
        </a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

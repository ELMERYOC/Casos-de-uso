<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mi Portal - Paciente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="d-flex">
    <!-- Menú lateral -->
    <div th:replace="~{fragments/menu :: menu-paciente}"></div>

    <!-- Contenido principal -->
    <div class="flex-grow-1 p-4">
        <h2 class="mb-4">Bienvenido a su Portal de Paciente</h2>

        <div class="row g-4">
            <div class="col-md-4">
                <div class="card bg-primary text-white p-3">
                    <h5>📅 Agendar Cita</h5>
                    <p class="mb-0">Reserve su cita médica</p>
                    <a href="/citas/paso/1" class="btn btn-light btn-sm mt-2">Agendar Ahora</a>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card bg-success text-white p-3">
                    <h5> Mis Citas</h5>
                    <p class="mb-0">Ver citas agendadas</p>
                    <a href="/paciente/mis-citas" class="btn btn-light btn-sm mt-2">Ver Citas</a>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card bg-info text-white p-3">
                    <h5>👤 Mi Perfil</h5>
                    <p class="mb-0">Actualizar información personal</p>
                    <a href="/paciente/perfil" class="btn btn-light btn-sm mt-2">Ver Perfil</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mantenimiento de Usuarios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
        <span class="navbar-brand">Panel Administrativo</span>
        <a href="/logout" class="btn btn-outline-light btn-sm">Cerrar Sesión</a>
    </div>
</nav>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Listado de Usuarios</h2>
        <a href="/admin/usuarios/nuevo" class="btn btn-primary">+ Crear Usuario</a>
    </div>

    <!-- Filtros (FA01, FA02) -->
    <form method="GET" action="/admin/usuarios" class="row g-3 mb-4">
        <div class="col-md-4">
            <select name="filtro" class="form-select">
                <option value="nombre" th:selected="${filtro == 'nombre'}">Nombre</option>
                <option value="email" th:selected="${filtro == 'email'}">Correo</option>
                <option value="rol" th:selected="${filtro == 'rol'}">Rol</option>
                <option value="dpi" th:selected="${filtro == 'dpi'}">DPI</option>
            </select>
        </div>
        <div class="col-md-6">
            <input type="text" name="valor" class="form-control" placeholder="Buscar..." th:value="${valor}">
        </div>
        <div class="col-md-2">
            <button type="submit" class="btn btn-primary w-100">🔍 Buscar</button>
        </div>
    </form>

    <!-- Tabla (FA03) -->
    <div class="table-responsive">
        <table class="table table-striped table-hover align-middle">
            <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Usuario</th>
                <th>Rol</th>
                <th>Estado</th>
                <th>Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="u : ${usuarios}">
                <td th:text="${u.id}">1</td>
                <td th:text="${u.nombre} + ' ' + ${u.apellidos}">Juan Pérez</td>
                <td th:text="${u.username}">jperez</td>
                <td><span class="badge bg-info" th:text="${u.rol}">PACIENTE</span></td>
                <td>
                    <span th:if="${u.esActivo}" class="badge bg-success">Activo</span>
                    <span th:unless="${u.esActivo}" class="badge bg-danger">Inactivo</span>
                </td>
                <td>
                    <div class="dropdown">
                        <button class="btn btn-sm btn-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown">⋮</button>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" th:href="@{/admin/usuarios/editar/{id}(id=${u.id})}">Editar</a></li>
                            <li><a class="dropdown-item text-danger" th:href="@{/admin/usuarios/eliminar/{id}(id=${u.id})}"
                                   onclick="return confirm('¿Está seguro de eliminar este usuario?')">Eliminar</a></li>
                        </ul>
                    </div>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(usuarios)}">
                <td colspan="6" class="text-center text-danger">No se encontraron datos de usuarios.</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

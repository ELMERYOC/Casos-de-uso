<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registro de Paciente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-4 mb-5">
    <div class="card shadow">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0">Registro de Usuario Externo</h4>
        </div>
        <div class="card-body">
            <div th:if="${errorMsg}" class="alert alert-danger" th:text="${errorMsg}"></div>

            <form th:action="@{/procesar-registro}" th:object="${usuario}" method="POST">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Nombre Completo *</label>
                        <input type="text" th:field="*{nombre}" class="form-control" required maxlength="150">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Apellidos *</label>
                        <input type="text" th:field="*{apellidos}" class="form-control" required maxlength="150">
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label class="form-label">DPI (13 dígitos) *</label>
                        <input type="text" th:field="*{dpi}" class="form-control" pattern="\d{13}" maxlength="13" required>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">NIT (8-9 caracteres)</label>
                        <input type="text" th:field="*{nit}" class="form-control" maxlength="9">
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Teléfono *</label>
                        <input type="text" th:field="*{telefono}" class="form-control" pattern="\d{8,20}" required>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Número de Seguro (Opcional)</label>
                        <input type="text" th:field="*{numeroSeguro}" class="form-control" maxlength="50">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Correo Electrónico *</label>
                        <input type="email" th:field="*{email}" class="form-control" required maxlength="100">
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Nombre de Usuario (8-15 chars) *</label>
                        <input type="text" th:field="*{username}" class="form-control" required minlength="8" maxlength="15">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Contraseña (mín. 8 chars) *</label>
                        <input type="password" th:field="*{password}" class="form-control" required minlength="8">
                    </div>
                </div>

                <div class="d-flex justify-content-between mt-4">
                    <a href="/" class="btn btn-secondary">Volver al Portal</a>
                    <button type="submit" class="btn btn-success">Registrarse</button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dashboard del Paciente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <span class="navbar-brand mb-0 h1">🏥 Portal del Paciente</span>
        <button class="btn btn-outline-light btn-sm" onclick="cerrarSesion()">Cerrar Sesión</button>
    </div>
</nav>

<div class="container mt-5 text-center">
    <h2>¡Bienvenido al Sistema de Citas!</h2>
    <p>Seleccione una opción para continuar:</p>
    <div class="d-grid gap-3 col-6 mx-auto mt-4">
        <!-- Aquí enlazamos con el CU-03 que ya tienes listo -->
        <a href="/citas/paso/1" class="btn btn-success btn-lg">Agendar Nueva Cita (CU-03)</a>
        <a href="/citas/mis-citas" class="btn btn-info btn-lg text-white">Ver Mis Citas</a>
    </div>
</div>

<script>
    // Verificar que haya token al cargar
    if (!sessionStorage.getItem('token')) {
        window.location.href = '/login';
    }

    function cerrarSesion() {
        sessionStorage.clear();
        window.location.href = '/';
    }
</script>
</body>
</html>

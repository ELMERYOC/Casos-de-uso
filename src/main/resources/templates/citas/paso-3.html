<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Agendar Cita - Paso 3</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5" style="max-width: 600px;">
    <h3 class="mb-3 text-center">Agendar Cita Médica</h3>
    <div class="progress mb-4" style="height: 10px;">
        <div class="progress-bar bg-primary" role="progressbar" style="width: 60%"></div>
    </div>
    <h5 class="text-center mb-4">Paso 3 de 5: Seleccione el Médico</h5>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <form th:action="@{/citas/paso/3}" method="post" class="card p-4 shadow-sm">
        <div class="mb-3">
            <label for="medicoId" class="form-label fw-bold">Médico Disponible</label>
            <select class="form-select" id="medicoId" name="medicoId" required>
                <option value="">-- Seleccione una opción --</option>
                <option th:each="medico : ${medicos}" th:value="${medico.id}" th:text="${medico.nombre} + ' ' + ${medico.apellidos}"></option>
            </select>
        </div>
        <div class="d-flex justify-content-between">
            <a th:href="@{/citas/volver/2}" class="btn btn-secondary">Volver</a>
            <button type="submit" class="btn btn-primary">Siguiente</button>
        </div>
    </form>
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Agendar Cita - Paso 1</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5" style="max-width: 600px;">
    <h3 class="mb-3 text-center">Agendar Cita Médica</h3>

    <!-- Indicador de Progreso (CU-03) -->
    <div class="progress mb-4" style="height: 10px;">
        <div class="progress-bar bg-primary" role="progressbar" style="width: 20%" aria-valuenow="20" aria-valuemin="0" aria-valuemax="100"></div>
    </div>
    <h5 class="text-center mb-4">Paso 1 de 5: Seleccione la Sucursal</h5>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <form th:action="@{/citas/paso/1}" method="post" class="card p-4 shadow-sm">
        <div class="mb-3">
            <label for="sucursalId" class="form-label fw-bold">Sede del Hospital</label>
            <select class="form-select" id="sucursalId" name="sucursalId" required>
                <option value="">-- Seleccione una opción --</option>
                <option th:each="sucursal : ${sucursales}" th:value="${sucursal.id}" th:text="${sucursal.nombre}"></option>
            </select>
        </div>
        <div class="d-flex justify-content-end">
            <button type="submit" class="btn btn-primary">Siguiente</button>
        </div>
    </form>
</div>
</body>
</html>

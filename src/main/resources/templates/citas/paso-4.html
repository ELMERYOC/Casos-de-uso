<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Agendar Cita - Paso 4</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5" style="max-width: 600px;">
    <h3 class="mb-3 text-center">Agendar Cita Médica</h3>
    <div class="progress mb-4" style="height: 10px;">
        <div class="progress-bar bg-primary" role="progressbar" style="width: 80%"></div>
    </div>
    <h5 class="text-center mb-4">Paso 4 de 5: Fecha y Hora</h5>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <form th:action="@{/citas/paso/4}" method="post" class="card p-4 shadow-sm">
        <div class="mb-3">
            <label for="fecha" class="form-label fw-bold">Fecha de la Cita</label>
            <input type="date" class="form-control" id="fecha" name="fecha" th:value="${fecha}" required th:min="${#temporals.format(#temporals.createNow(), 'yyyy-MM-dd')}">
        </div>
        <div class="mb-3">
            <label for="hora" class="form-label fw-bold">Hora Disponible</label>
            <select class="form-select" id="hora" name="hora" required>
                <option value="">-- Seleccione un horario --</option>
                <option th:each="h : ${horarios}" th:value="${h}" th:text="${h}"></option>
            </select>
        </div>
        <div class="d-flex justify-content-between">
            <a th:href="@{/citas/volver/3}" class="btn btn-secondary">Volver</a>
            <button type="submit" class="btn btn-primary">Siguiente</button>
        </div>
    </form>
</div>
</body>
</html>

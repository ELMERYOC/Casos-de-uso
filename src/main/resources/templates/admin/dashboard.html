<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Panel de Administración</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="d-flex">
    <!-- Menú lateral -->
    <div th:replace="~{fragments/menu :: menu-admin}"></div>

    <!-- Contenido principal -->
    <div class="flex-grow-1 p-4">
        <h2 class="mb-4">Panel de Administración</h2>

        <div class="row g-4">
            <div class="col-md-3">
                <div class="card bg-primary text-white p-3">
                    <h5>👥 Usuarios</h5>
                    <p class="mb-0">Gestiona usuarios del sistema</p>
                    <a href="/admin/usuarios" class="btn btn-light btn-sm mt-2">Ir a Usuarios</a>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card bg-success text-white p-3">
                    <h5>🏢 Sucursales</h5>
                    <p class="mb-0">Administra sedes del hospital</p>
                    <a href="/admin/sucursales" class="btn btn-light btn-sm mt-2">Ver Sucursales</a>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card bg-info text-white p-3">
                    <h5> Especialidades</h5>
                    <p class="mb-0">Gestiona especialidades médicas</p>
                    <a href="/admin/especialidades" class="btn btn-light btn-sm mt-2">Ver Especialidades</a>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card bg-warning text-dark p-3">
                    <h5>📅 Citas</h5>
                    <p class="mb-0">Consulta citas agendadas</p>
                    <a href="/admin/citas" class="btn btn-light btn-sm mt-2">Ver Citas</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
